[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zoe"
version = "0.1.0"
description = "Personal Local AI Computer Assistant for macOS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyobjc-core>=12.2.2",
    "pyobjc-framework-Quartz>=12.2.2",
    "pyobjc-framework-ApplicationServices>=12.2.2",
    "pyobjc-framework-Cocoa>=12.2.2",
    "pillow>=12.0.0",
    "pyyaml>=6.0.0",
]

[project.scripts]
zoe = "zoe.main:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
