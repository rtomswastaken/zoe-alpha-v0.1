# Zoe macOS System Configuration
version: "1.0"

model:
  provider: "ollama"
  name: "qwen3:14b"           # default local model; qwen3-coder:30b is also supported
  endpoint: "http://127.0.0.1:11434"
  temperature: 0.1
  max_tokens: 2048
  timeout: 180.0

vision:
  provider: "ollama"
  model: "minicpm-v"          # local vision model
  endpoint: "http://127.0.0.1:11434"
  max_tokens: 1024
  enabled: true
  confidence_threshold: 0.75
  debug_overlay: false

agent:
  max_tool_calls: 30
  timeout_seconds: 300.0
  system_prompt_extra: ""

cursor:
  default_duration: 0.35      # seconds
  default_steps: 40           # interpolation steps for smooth movement
  easing: "cubic_bezier"      # cubic_bezier, sine, linear
  jitter: 1.5                 # slight micro-jitter for human-like movement
  bounds_check: true

mouse:
  click_delay: 0.05           # delay between down and up in seconds
  double_click_interval: 0.12 # interval between clicks for double-click
  drag_duration: 0.5

keyboard:
  typing_delay: 0.02          # inter-character delay in seconds
  key_press_duration: 0.03    # duration to hold key down

emergency:
  enabled: true
  hotkey: "escape"            # Global emergency key
  poll_interval: 0.01

logging:
  enabled: true
  file_path: "logs/zoe.log"
  console_output: true
  mask_sensitive: true

screenshots:
  storage_dir: "cache/screenshots"
  format: "png"
  local_only: true

voice:
  enabled: true
  sample_rate: 16000
  wake_word:
    phrase: "zoe"
    enabled: true
    threshold: 0.6
  stt:
    provider: "faster_whisper"
    model: "base.en"
    compute_type: "int8"
    language: "en"
  tts:
    provider: "nsspeech"
    voice: "Samantha"
    rate: 190
    volume: 1.0
  interruption:
    voice_stop: true
    keyboard_stop: true

ui:
  notch:
    enabled: true
    animation: true
    voice_reactive: true
    show_on_idle: false
    glow_spread: 24.0
