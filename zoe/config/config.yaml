# Zoe macOS System Configuration
version: "1.0"

cursor:
  default_duration: 0.35      # seconds
  default_steps: 40           # interpolation steps for smooth movement
  easing: "cubic_bezier"      # cubic_bezier, sine, linear
  jitter: 1.5                 # slight micro-jitter for human-like movement
  bounds_check: true

mouse:
  click_delay: 0.05           # delay between down and up in seconds
  double_click_interval: 0.12 # interval between clicks for double-click
  drag_duration: 0.5

keyboard:
  typing_delay: 0.02          # inter-character delay in seconds
  key_press_duration: 0.03    # duration to hold key down

emergency:
  enabled: true
  hotkey: "escape"            # Global emergency key
  poll_interval: 0.01

logging:
  enabled: true
  file_path: "logs/zoe.log"
  console_output: true
  mask_sensitive: true

screenshots:
  storage_dir: "cache/screenshots"
  format: "png"
  local_only: true
